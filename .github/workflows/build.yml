name: Build and Release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME//\//-}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            VERSION="dev-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          filename="WebKiller-leak-${VERSION}-${GOOS}-${GOARCH}${ext}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${filename}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 |
            sort -z |
            xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Build Chinese release notes
        shell: bash
        run: |
          cat .github/release-notes-zh.md > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<EOF

## 本次版本

- **版本号**：\`${{ github.ref_name }}\`
- **提交**：\`${{ github.sha }}\`
- **发布日期**：$(date -u +'%Y-%m-%d %H:%M:%S UTC')

## 发行产物

EOF
          for file in dist/*; do
            base="$(basename "$file")"
            if [ "$base" = "SHA256SUMS.txt" ]; then
              continue
            fi
            echo "- \`${base}\`" >> RELEASE_NOTES.md
          done
          cat >> RELEASE_NOTES.md <<'EOF'

## SHA256 校验和

```text
EOF
          cat dist/SHA256SUMS.txt >> RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<'EOF'
```
EOF
      - name: Publish release
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "WebKiller-Leak ${TAG}" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "WebKiller-Leak ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
